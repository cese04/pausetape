[package]
name = "neatlibrary"
version = "0.1.0"
edition = "2024"
description = "Organise a music library for the Snowsky Echo Mini (RECHO firmware), and play it."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chardetng = "1"
crossbeam-channel = "0.5.17"
deunicode = "1.6.2"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.191"
lofty = "0.25.5"
rfd = "0.17.2"
# Playback only: rodio's default "recording" (microphone) support is never used.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
trash = "5"
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Symphonia (FLAC/MP3 decoding) is painfully slow unoptimised; keep our own crate fast to rebuild.
[profile.dev.package."*"]
opt-level = 2
